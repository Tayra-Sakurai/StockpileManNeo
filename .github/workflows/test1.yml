name: Test building with NPM
on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    name: Build NPM in Production mode
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node_version: ['24', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node_version }}

      - name: Collect packages
        run: npm ci
        working-directory: ./stockpilemanneo

      - name: Build
        run: npm run build
        working-directory: ./stockpilemanneo

      - uses: actions/upload-artifact@v7
        with:
          path: stockpilemanneo/dist/**